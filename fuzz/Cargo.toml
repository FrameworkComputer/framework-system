[package]
name = "framework_lib-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.framework_lib]
path = "../framework_lib"
# No hidapi/rusb, nothing to fuzz there and avoids needing the system libraries
default-features = false

# Keep out of the main workspace, so normal builds don't need nightly/libfuzzer
[workspace]
members = ["."]

[profile.release]
debug = 1
overflow-checks = true

[[bin]]
name = "ec_memmap"
path = "fuzz_targets/ec_memmap.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ec_host_cmd"
path = "fuzz_targets/ec_host_cmd.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ec_binary"
path = "fuzz_targets/ec_binary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ccgx_binary"
path = "fuzz_targets/ccgx_binary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "capsule"
path = "fuzz_targets/capsule.rs"
test = false
doc = false
bench = false

[[bin]]
name = "h2o_capsule"
path = "fuzz_targets/h2o_capsule.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ec_reflash"
path = "fuzz_targets/ec_reflash.rs"
test = false
doc = false
bench = false
